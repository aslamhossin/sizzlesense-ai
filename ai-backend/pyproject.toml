[project]
name = "sizzlesense-ai-backend"
version = "0.1.0"
description = "Applied AI Human Learning & Culinary Perception Engine (4-Stage Cognitive Pipeline, Computer Vision, and Evaluation Suite)"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pillow>=11.0.0",
    "numpy>=2.1.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
