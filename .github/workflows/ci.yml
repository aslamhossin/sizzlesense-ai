name: SizzleSense AI CI (Applied AI Backend & Android MVI Client)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ai-backend-eval-and-tests:
    name: Python Applied AI Backend & EvalBench (22 Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "ai-backend/uv.lock"

      - name: Sync dependencies
        run: uv sync --frozen || uv sync

      - name: Run Pytest & 10-Trajectory Human Learning EvalBench
        env:
          GEMINI_API_KEY: ""
        run: uv run pytest -v

  android-unit-tests-and-build:
    name: Android Clean Architecture & MVI Unit Tests + Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run Android Unit Tests and Assemble Debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon
